name: Shell syntax checks

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n install.sh scripts/*
